services:
  double-scramble:
    container_name: double-scramble
    image: ghcr.io/jagsingh/double-scramble-live:latest   # or: build: .
    # build: .                                           # build locally from Dockerfile
    restart: unless-stopped                            # 24/7
    environment:
      PYTHONUNBUFFERED: "1"
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:?missing}
      TZ: America/Chicago   # clock overlay shows container-local time
      # DEMO: "1"            # uncomment to run without an SDR
      # WIDTH: "1920"
      # HEIGHT: "1080"
      # VIDEO_BITRATE: "4500k"
    volumes:
      # readsb on the host writes /run/readsb/aircraft.json. Mount the
      # directory (readsb replaces the file by rename). Requires
      # RuntimeDirectoryPreserve=yes on readsb.service - see README - or a
      # readsb restart leaves this mount on a deleted directory.
      - /run/readsb:/adsb:ro
      - ./output:/output      # local HLS preview when no stream key is set
    # Bounded logs: 24/7 event lines otherwise grow the json-file log
    # without limit on the host disk. 3 x 10 MB = 30 MB ceiling.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
